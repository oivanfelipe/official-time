<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>Official Time — Apresentação</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
/* =========================================================
   OFFICIAL TIME — REDESIGN VISUAL
   O conteúdo original é carregado integralmente do GitHub.
   Este arquivo altera somente a apresentação visual.
   ========================================================= */
:root{
  --ot-red:#E50914;
  --ot-red-soft:rgba(229,9,20,.10);
  --ot-bg:#0b0a0a;
  --ot-surface:#121010;
  --ot-surface-2:#191616;
  --ot-line:rgba(255,255,255,.075);
  --ot-text:#f4efec;
  --ot-muted:#8e8582;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;background:var(--ot-bg)}
body{
  margin:0!important;
  background:
    radial-gradient(circle at 85% 8%,rgba(229,9,20,.08),transparent 25%),
    var(--ot-bg)!important;
  color:var(--ot-text)!important;
  font-family:Inter,system-ui,sans-serif!important;
  line-height:1.6!important;
}
body::before{
  content:"";
  position:fixed;inset:0;pointer-events:none;z-index:9998;
  background:linear-gradient(90deg,transparent 0 7%,rgba(255,255,255,.018) 7.05%,transparent 7.1%);
  opacity:.35;
}
body > .nav,
.nav{
  height:58px!important;
  padding:0 38px!important;
  background:rgba(11,10,10,.86)!important;
  border-bottom:1px solid var(--ot-line)!important;
  backdrop-filter:blur(18px)!important;
}
.nav-brand{
  font-family:Manrope,Inter,sans-serif!important;
  font-weight:800!important;
  letter-spacing:.16em!important;
}
.nav-links{gap:3px!important}
.nav-link{
  font-size:10px!important;
  letter-spacing:.11em!important;
  padding:7px 12px!important;
}
.nav-theme{
  border-color:var(--ot-line)!important;
  border-radius:999px!important;
  padding:6px 12px!important;
}
section{
  min-height:100svh;
  scroll-margin-top:58px!important;
}
.container{

  padding:0 42px!important;
}
.section-pad{padding:92px 0!important}
.sec-hd{

.eyebrow{

  letter-spacing:.22em!important;

}
h2.display{

  font-size:clamp(42px,5.2vw,76px)!important;

  letter-spacing:-.065em!important;

.sec-hd-desc{

.capa-period{

.capa-pillars{gap:9px!important}
.capa-pillar{

.roas-hero-label{font-size:9px!important;letter-spacing:.16em!important}
.kpi-row{

.kpi-item{

.kpi-eyebrow{font-size:8px!important;letter-spacing:.16em!important}
.kpi-val{

  font-weight:800!important;

}
.chart-card,.mkt-block,.sim-box{
  background:rgba(18,16,16,.78)!important;
  border:1px solid var(--ot-line)!important;
  box-shadow:0 24px 70px rgba(0,0,0,.16);

.chart-card-hd{margin-bottom:20px!important}
h3.label{font-size:8px!important;letter-spacing:.16em!important}
.roas-row{gap:16px!important}
.roas-lbl{font-size:12px!important}
.roas-track{height:7px!important}
.roas-note{font-size:11px!important}

.seas-title{

.tab-nav{

.tab-btn{

}
.action-tbl th{

  letter-spacing:.12em!important;
}
.action-tbl td{

}
.act-name{font-weight:700!important}
.cal-timeline{

.cal-month-card{

.cal-mo{

}
.intel-grid,.mkt-kpis,.mkt-facts,.sim-cards,.comp-summary,.comp-grid,.gaps-grid,.recs-grid{
  background:var(--ot-line)!important;
  gap:1px!important;
}
.intel-card,.comp-card,.gap-card,.rec-card,.comp-sum-item{

}
.intel-card{
  padding:25px 23px!important;
  min-height:245px;
}
.intel-tag,.gap-badge,.rec-priority{
  border-radius:999px!important;
  font-size:8px!important;
  letter-spacing:.1em!important;
}
.intel-title,.rec-title,.comp-name{
  font-family:Manrope,Inter,sans-serif!important;
  font-weight:800!important;
  letter-spacing:-.035em!important;
}
.mkt-block,.sim-box{padding:27px 30px!important}
.mkt-header h3,.sim-header h3{
  font-family:Manrope,Inter,sans-serif!important;
  font-weight:800!important;
  letter-spacing:-.04em!important;
}
.mkt-kpi,.mkt-fact,.sim-card,.comp-stat{
  background:var(--ot-surface-2)!important;
}
.mkt-kpi-val,.sim-rev,.comp-sum-val,.comp-stat-val{
  font-family:Manrope,Inter,sans-serif!important;
  font-weight:800!important;
  letter-spacing:-.05em!important;
}
.sim-input-row{
  border:1px solid var(--ot-line);
  background:rgba(255,255,255,.025)!important;
}
input[type=range].sim-slider{background:rgba(255,255,255,.12)!important}
.comp-card.card-official{
  background:linear-gradient(180deg,rgba(229,9,20,.08),var(--ot-surface))!important;
}
.comp-name{font-size:25px!important}
.gap-card.is-win{background:linear-gradient(90deg,rgba(82,183,136,.05),var(--ot-surface))!important}
.rec-card{min-height:230px}
.rec-impact{font-size:9px!important}
.fi{
  transform:translateY(18px)!important;
  transition:opacity .55s ease,transform .55s ease!important;
}
.sec-divider{

}
@media(max-width:760px){
  #capa{grid-template-columns:1fr!important}
  .capa-right{height:48vw;border-left:0!important;border-top:1px solid var(--ot-line)}
  .capa-left{padding:70px 30px 35px!important}
  .container{padding:0 22px!important}
  .sec-hd{grid-template-columns:1fr!important;gap:20px!important}
}
@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .fi{transition:none!important;transform:none!important}
}

/* Modo apresentação: pressione P */
body.ot-present .nav{
  opacity:0;
  pointer-events:none;
}
body.ot-present section{
  min-height:100svh!important;
}
body.ot-present .section-pad{
  padding-top:75px!important;
  padding-bottom:55px!important;
}
body.ot-present{
  cursor:none;
}
.ot-present-hint{
  position:fixed;right:18px;bottom:18px;z-index:10001;
  padding:7px 10px;border:1px solid var(--ot-line);
  border-radius:999px;background:rgba(0,0,0,.65);
  color:#777;font:9px Inter,sans-serif;letter-spacing:.08em;
  opacity:0;transition:opacity .2s;
}
body.ot-present:hover .ot-present-hint{opacity:1}
</style>
</head>
<body>
<div id="app">
  <div style="min-height:100vh;display:grid;place-items:center;background:#0b0a0a;color:#aaa;font:13px Inter,sans-serif">
    Carregando apresentação…
  </div>
</div>
<div class="ot-present-hint">ESC · sair da apresentação</div>

<script>
const SOURCE = "https://raw.githubusercontent.com/oivanfelipe/official-time/main/index.html";

function injectDesign(doc){
  const style = document.createElement("style");
  style.textContent = document.querySelector("style").textContent;
  doc.head.appendChild(style);

  // Remove only the original stylesheet blocks so the redesign controls
  // the visual layer. The HTML/text/data/scripts remain unchanged.
  [...doc.querySelectorAll("link[rel='stylesheet']")].forEach(el=>{
    if(el.href.includes("fonts.googleapis.com")) return;
  });

  const font = document.createElement("link");
  font.rel="preconnect"; font.href="https://fonts.googleapis.com";
  doc.head.appendChild(font);
  const fontCss=document.createElement("link");
  fontCss.rel="stylesheet";
  fontCss.href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700;800&display=swap";
  doc.head.appendChild(fontCss);

  const hint = document.createElement("div");
  hint.className="ot-present-hint";
  hint.textContent="ESC · sair da apresentação";
  doc.body.appendChild(hint);

  // Presentation navigation
  const sections=[...doc.querySelectorAll("section")];
  let idx=0;
  function go(n){
    idx=Math.max(0,Math.min(sections.length-1,n));
    sections[idx]?.scrollIntoView({behavior:"smooth",block:"start"});
  }
  document.addEventListener("keydown",e=>{
    if(e.key.toLowerCase()==="p"){
      doc.body.classList.toggle("ot-present");
      if(doc.body.classList.contains("ot-present") && doc.documentElement.requestFullscreen){
        doc.documentElement.requestFullscreen().catch(()=>{});
      }
    }
    if(e.key==="Escape"){
      doc.body.classList.remove("ot-present");
      if(document.fullscreenElement) document.exitFullscreen().catch(()=>{});
    }
    if(["ArrowRight","PageDown"].includes(e.key)){e.preventDefault();go(idx+1)}
    if(["ArrowLeft","PageUp"].includes(e.key)){e.preventDefault();go(idx-1)}
    if(e.key==="Home"){e.preventDefault();go(0)}
    if(e.key==="End"){e.preventDefault();go(sections.length-1)}
  });
  const obs=new IntersectionObserver(entries=>{
    entries.forEach(e=>{
      if(e.isIntersecting){
        const n=sections.indexOf(e.target);
        if(n>=0) idx=n;
      }
    })
  },{threshold:.55});
  sections.forEach(s=>obs.observe(s));
}

async function load(){
  try{
    const r=await fetch(SOURCE,{cache:"no-store"});
    if(!r.ok) throw new Error("Falha ao carregar o HTML original.");
    const source=await r.text();
    const parsed=new DOMParser().parseFromString(source,"text/html");

    // Preserve original body/content and original scripts.
    const target=document.getElementById("app");
    target.replaceWith(parsed.body);

    injectDesign(parsed);

    // Move parsed document into the real document.
    document.title=parsed.title || "Official Time";
    document.documentElement.lang=parsed.documentElement.lang || "pt-BR";
  }catch(err){
    document.getElementById("app").innerHTML=
      '<div style="min-height:100vh;display:grid;place-items:center;padding:30px;background:#0b0a0a;color:#f4efec;font:14px Inter,sans-serif;text-align:center">'+
      '<div><strong>Não foi possível carregar a apresentação.</strong><br><span style="color:#777">Abra este arquivo com internet ativa para carregar o conteúdo original do GitHub.</span></div></div>';
    console.error(err);
  }
}
load();
</script>
</body>
</html>
